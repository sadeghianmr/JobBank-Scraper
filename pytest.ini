# pytest configuration

[pytest]
# Where to find tests
testpaths = tests

# Test file patterns  
python_files = test_*.py

# Test function patterns
python_functions = test_*

# Show extra test summary info
# Options: verbose, short traceback, strict markers, code coverage
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=api
    --cov=src
    --cov-report=html
    --cov-report=term

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that test multiple components together
    unit: marks tests that test single components in isolation

# Asyncio mode
asyncio_mode = auto
